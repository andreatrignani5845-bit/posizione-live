
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intelligenza Artificiale Jarvis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 35px auto;
      padding: 18px;
      background: #f3f5f9;
      color: #172033;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
    }
    button {
      background: #2459d3;
      color: white;
      border: 0;
      border-radius: 8px;
    }
    #status, #coords { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>Jarvis</h1>
  <p>Accedi con il tuo account Firebase.</p>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="login">Accedi</button>

  <hr>
  <p>La posizione verrà condivisa solo dopo aver autorizzato il GPS.</p>
  <button id="share">Consento e condivido la mia posizione</button>
  <button id="view">Visualizza posizione condivisa</button>

  <p id="status">Non connesso.</p>
  <p id="coords"></p>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    set,
    onValue
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAczxWWw3slssU80w_OUYr4Qk4wo7F2b0",
    authDomain: "posizione-live.firebaseapp.com",
    databaseURL: "https://posizione-live-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "posizione-live",
    storageBucket: "posizione-live.firebasestorage.app",
    messagingSenderId: "842741432656",
    appId: "1:842741432656:web:0d30b70bfe6c4fa5b1ec55",
    measurementId: "G-HF24MCLV51"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const status = document.getElementById("status");
  const coords = document.getElementById("coords");

  let watchId = null;

  document.getElementById("login").onclick = async () => {
    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );
      status.textContent = "Accesso effettuato.";
    } catch (error) {
      status.textContent = "Accesso non riuscito: " + error.message;
    }
  };

  document.getElementById("share").onclick = () => {
    if (!auth.currentUser) {
      status.textContent = "Accedi prima con il tuo account autorizzato.";
      return;
    }

    if (!navigator.geolocation) {
      status.textContent = "Questo browser non supporta la geolocalizzazione.";
      return;
    }

    status.textContent = "Richiesta del permesso GPS...";

    watchId = navigator.geolocation.watchPosition(async (position) => {
      try {
        const uid = auth.currentUser?.uid;
        if (!uid) return;

        await set(ref(db, "positions/" + uid), {
          lat: position.coords.latitude,
          lon: position.coords.longitude,
          accuracy: position.coords.accuracy,
          updatedAt: Date.now()
        });

        status.textContent = "Posizione inviata al database.";
      } catch (error) {
        status.textContent = "Invio non riuscito: " + error.message;
      }
    }, (error) => {
      status.textContent = "GPS non disponibile: " + error.message;
    }, {
      enableHighAccuracy: true,
      maximumAge: 5000,
      timeout: 15000
    });
  };

  document.getElementById("view").onclick = () => {
    if (!auth.currentUser) {
      status.textContent = "Accedi prima con il tuo account autorizzato.";
      return;
    }

    onValue(ref(db, "positions/" + auth.currentUser.uid), (snapshot) => {
      const position = snapshot.val();

      if (!position) {
        coords.textContent = "Nessuna posizione disponibile.";
        return;
      }

      coords.replaceChildren();

      const details = document.createElement("p");
      details.textContent =
        `Latitudine: ${position.lat}; longitudine: ${position.lon}; ` +
        `precisione: circa ${Math.round(position.accuracy)} metri.`;
      coords.appendChild(details);

      const mapLink = document.createElement("a");
      mapLink.href =
        `https://www.openstreetmap.org/?mlat=${position.lat}` +
        `&mlon=${position.lon}#map=16/${position.lat}/${position.lon}`;
      mapLink.target = "_blank";
      mapLink.rel = "noopener noreferrer";
      mapLink.textContent = "Apri posizione sulla mappa";
      coords.appendChild(mapLink);
    }, (error) => {
      status.textContent = "Lettura non consentita: " + error.message;
    });
  };
</script>
</body>
</html>
