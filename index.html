
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis - Posizione Live</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 35px auto;
      padding: 18px;
      background: #f3f5f9;
      color: #172033;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
    }
    button {
      background: #2459d3;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #status, #coords { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>Jarvis</h1>
  <p>Accedi con l'account Firebase autorizzato.</p>

  <input id="email" type="email" placeholder="Email"
         autocomplete="username">
  <input id="password" type="password" placeholder="Password"
         autocomplete="current-password">
  <button id="login">Accedi</button>

  <hr>
  <p>Condivisione volontaria della posizione GPS.</p>

  <button id="share">
    Consento e condivido la posizione da questo telefono
  </button>

  <button id="view">
    Visualizza la posizione di mia nipote
  </button>

  <p id="status">Non connesso.</p>
  <p id="coords"></p>
</main>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    set,
    onValue
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAczxWWw3slssU80w_OUYr4Qk4wo7F2b0",
    authDomain: "posizione-live.firebaseapp.com",
    databaseURL: "https://posizione-live-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "posizione-live",
    storageBucket: "posizione-live.firebasestorage.app",
    messagingSenderId: "842741432656",
    appId: "1:842741432656:web:0d30b70bfe6c4fa5b1ec55",
    measurementId: "G-HF24MCLV51"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const status = document.getElementById("status");
  const coords = document.getElementById("coords");

  let watchId = null;
  let unsubscribe = null;

  document.getElementById("login").onclick = async () => {
    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );
      status.textContent = "Accesso effettuato.";
    } catch (error) {
      status.textContent = "Errore di accesso: " + error.message;
    }
  };

  // La posizione condivisa viene salvata per questo specifico ruolo.
  // Sul telefono della nipote, premere questo pulsante per autorizzare
  // e avviare la condivisione.
  document.getElementById("share").onclick = () => {
    if (!auth.currentUser) {
      status.textContent = "Accedi prima.";
      return;
    }

    if (!navigator.geolocation) {
      status.textContent = "Geolocalizzazione non supportata.";
      return;
    }

    if (watchId !== null) {
      status.textContent = "La condivisione è già attiva su questo telefono.";
      return;
    }

    status.textContent = "In attesa del permesso GPS...";

    watchId = navigator.geolocation.watchPosition(
      async (position) => {
        try {
          const uid = auth.currentUser?.uid;
          if (!uid) return;

          await set(
            ref(db, "positions/" + uid + "/devices/niece"),
            {
              lat: position.coords.latitude,
              lon: position.coords.longitude,
              accuracy: position.coords.accuracy,
              updatedAt: Date.now()
            }
          );

          status.textContent = "Posizione condivisa da questo telefono.";
        } catch (error) {
          status.textContent = "Errore nel salvataggio: " + error.message;
        }
      },
      (error) => {
        status.textContent = "Errore GPS: " + error.message;
        watchId = null;
      },
      {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 20000
      }
    );
  };

  // Legge in tempo reale la posizione condivisa dal telefono della nipote.
  document.getElementById("view").onclick = () => {
    if (!auth.currentUser) {
      status.textContent = "Accedi prima.";
      return;
    }

    if (unsubscribe) {
      unsubscribe();
      unsubscribe = null;
    }

    coords.textContent = "";
    status.textContent = "Ricerca della posizione condivisa...";

    const uid = auth.currentUser.uid;
    const locationRef = ref(db, "positions/" + uid + "/devices/niece");

    unsubscribe = onValue(
      locationRef,
      (snapshot) => {
        if (!snapshot.exists()) {
          status.textContent =
            "Nessuna posizione trovata. Sul telefono di tua nipote, accedi e premi il pulsante di condivisione GPS.";
          coords.textContent = "";
          return;
        }

        const p = snapshot.val();
        status.textContent = "Posizione ricevuta.";
        coords.textContent =
          "Latitudine: " + p.lat +
          "\nLongitudine: " + p.lon +
          "\nPrecisione GPS: circa " + Math.round(p.accuracy) + " metri" +
          "\nUltimo aggiornamento: " +
          new Date(p.updatedAt).toLocaleString("it-IT") +
          "\n\nApri la posizione: https://www.google.com/maps?q=" +
          encodeURIComponent(p.lat + "," + p.lon);
      },
      (error) => {
        status.textContent = "Errore di lettura: " + error.message;
      }
    );
  };
</script>
</body>
</html>
